<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 540" width="1180" height="540" role="img" aria-label="A tap in the Electron kiosk enables text-input on labwc, which activates squeekboard; the patched squeekboard draws on the OVERLAY layer above the fullscreen app, and its key taps come back to the app as committed text."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#94a3b8"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#94a3b8"/></marker></defs><rect x="22.0" y="26" width="196" height="44" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(38.0,38.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-6 8-6s8 2 8 6"/></g><text x="69.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">User</text><line x1="120" y1="70" x2="120" y2="470" stroke="#d8dee4" stroke-width="1" stroke-dasharray="4 5"/><rect x="342.0" y="26" width="196" height="44" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(358.0,38.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M3 12h18 M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9 M12 3c-2.5 2.7-3.8 5.7-3.8 9s1.3 6.3 3.8 9"/></g><text x="389.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">Electron kiosk</text><line x1="440" y1="70" x2="440" y2="470" stroke="#d8dee4" stroke-width="1" stroke-dasharray="4 5"/><rect x="662.0" y="26" width="196" height="44" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1"/><g transform="translate(678.0,38.0) scale(0.8750)" fill="none" stroke="#0f172a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M9 20h6 M12 17v3 M6 13l3.5-4 2.5 3 2-2.5L18 13"/></g><text x="709.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="600">labwc</text><line x1="760" y1="70" x2="760" y2="470" stroke="#d8dee4" stroke-width="1" stroke-dasharray="4 5"/><rect x="962.0" y="26" width="196" height="44" rx="10" fill="#2b59c3" stroke="#2b59c3" stroke-width="1"/><g transform="translate(978.0,38.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M9 9l-3 3 3 3 M15 9l3 3-3 3"/></g><text x="1009.0" y="53.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="start" font-weight="600">squeekboard</text><line x1="1060" y1="70" x2="1060" y2="470" stroke="#d8dee4" stroke-width="1" stroke-dasharray="4 5"/><polyline points="128,104 432,104" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="280.0" y="95.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">1  tap a text field</text><polyline points="448,150 752,150" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="600.0" y="141.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">2  text-input: enable</text><text x="600.0" y="167.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6673" text-anchor="middle">needs --enable-wayland-ime</text><polyline points="768,196 1052,196" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="910.0" y="187.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">3  input-method: activate</text><polyline points="1052,242 768,242" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="910.0" y="233.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">4  layer surface on OVERLAY</text><text x="910.0" y="259.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#5b6673" text-anchor="middle">needs this patch</text><polyline points="752,292 128,292" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="440.0" y="283.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">5  keyboard drawn above the fullscreen app</text><polyline points="128,334 1052,334" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="325.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">6  tap keys</text><polyline points="1052,376 768,376" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="910.0" y="367.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">7  input-method: commit string</text><polyline points="752,418 448,418" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/><text x="600.0" y="409.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">8  text-input: commit</text><polyline points="432,460 128,460" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="280.0" y="451.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#475569" text-anchor="middle">9  text appears in the field</text><line x1="24" y1="488" x2="1156" y2="488" stroke="#e6e9ee" stroke-width="1"/><text x="24.0" y="514.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#5b6673" text-anchor="start">Miss the patch and step 5 draws the keyboard behind the app. Miss --enable-wayland-ime and step 2 never happens.</text></svg>