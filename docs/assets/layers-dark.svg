<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 450" width="1180" height="450" role="img" aria-label="Layer-shell stacking from top to bottom: OVERLAY, the fullscreen kiosk app, TOP, then BOTTOM and BACKGROUND. squeekboard asks for TOP, under the fullscreen app; the patch moves it to OVERLAY."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="40" width="800" height="72" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(40.0,53.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M9 9l-3 3 3 3 M15 9l3 3-3 3"/></g><text x="71.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">OVERLAY  ·  layer 3</text><text x="40.0" y="92.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">Where the patched keyboard is drawn</text><rect x="24" y="126" width="800" height="72" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,139.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M8 21h8"/></g><text x="71.0" y="154.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Fullscreen surfaces</text><text x="40.0" y="178.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">The kiosk app, covering everything below it</text><rect x="24" y="212" width="800" height="72" rx="10" fill="#2a1d14" stroke="#ffa657" stroke-width="1"/><g transform="translate(40.0,225.0) scale(0.8750)" fill="none" stroke="#ffa657" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M9 9l-3 3 3 3 M15 9l3 3-3 3"/></g><text x="71.0" y="240.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffa657" text-anchor="start" font-weight="600">TOP  ·  layer 2</text><text x="40.0" y="264.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffa657" text-anchor="start">Where stock squeekboard asks to be, so it is hidden</text><rect x="24" y="298" width="800" height="72" rx="10" fill="#1b2230" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,311.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="71.0" y="326.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">BOTTOM and BACKGROUND  ·  layers 1 and 0</text><text x="40.0" y="350.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Panels and wallpaper</text><polyline points="832,248.0 884,248.0 884,76.0 832,76.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="900.0" y="156.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#e6edf3" text-anchor="start" font-weight="600">this patch</text><text x="900.0" y="176.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">LAYER_TOP → LAYER_OVERLAY</text><line x1="24" y1="398" x2="1156" y2="398" stroke="#232a33" stroke-width="1"/><text x="24.0" y="424.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">No compositor setting fixes this: a fullscreen window covers TOP, so the keyboard itself has to ask for OVERLAY.</text></svg>