<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 430" width="1180" height="430" role="img" aria-label="A tap in the Electron kiosk enables text-input on labwc, which activates Squeekboard; the patched Squeekboard draws on the OVERLAY layer above the fullscreen app, and its key taps come back to the app as committed text."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker><marker id="b" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10 0 0 5 10 10z" fill="#6b7684"/></marker></defs><rect x="24" y="50" width="170" height="116" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,63.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-6 8-6s8 2 8 6"/></g><text x="71.0" y="78.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">User</text><text x="40.0" y="102.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">the person at the kiosk</text><rect x="345" y="50" width="170" height="116" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(361.0,63.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M3 12h18 M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9 M12 3c-2.5 2.7-3.8 5.7-3.8 9s1.3 6.3 3.8 9"/></g><text x="392.0" y="78.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Electron Kiosk</text><text x="361.0" y="102.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">text-input client,</text><text x="361.0" y="120.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">--enable-wayland-ime</text><rect x="665" y="50" width="170" height="116" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(681.0,63.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v12H3z M9 20h6 M12 17v3 M6 13l3.5-4 2.5 3 2-2.5L18 13"/></g><text x="712.0" y="78.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">labwc</text><text x="681.0" y="102.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Wayland compositor</text><rect x="986" y="50" width="170" height="116" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(1002.0,63.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4z M9 9l-3 3 3 3 M15 9l3 3-3 3"/></g><text x="1033.0" y="78.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Squeekboard</text><text x="1002.0" y="102.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">on-screen keyboard,</text><text x="1002.0" y="120.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">asks for OVERLAY</text><polyline points="202,84 337,84" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="269.5" y="75.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">1 tap a text field</text><polyline points="337,132 202,132" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="269.5" y="149.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">9 text appears</text><polyline points="523,84 657,84" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="62.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">2 text-input:</text><text x="590.0" y="75.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">enable</text><polyline points="657,132 523,132" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="149.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">8 text-input:</text><text x="590.0" y="162.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">commit</text><polyline points="843,84 978,84" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="910.5" y="62.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">3 input-method:</text><text x="910.5" y="75.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">activate</text><polyline points="978,132 843,132" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="910.5" y="149.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">7 input-method:</text><text x="910.5" y="162.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">commit string</text><rect x="24" y="250" width="170" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(40.0,285.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M4 21c0-4 3.6-6 8-6s8 2 8 6"/></g><text x="71.0" y="300.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" fill="#e6edf3" text-anchor="start" font-weight="600">User Taps Keys</text><rect x="986" y="250" width="170" height="90" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(1002.0,263.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13v11H3z M6 4h13v11 M7 14l3-3 2.5 2.5L15 11l2 2.5"/></g><text x="1033.0" y="278.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Overlay Layer</text><text x="1002.0" y="302.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">the patched keyboard,</text><text x="1002.0" y="320.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">above the kiosk app</text><polyline points="1071.0,174 1071.0,242" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="1059.0" y="218.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="end">4 layer surface on OVERLAY</text><text x="1059.0" y="232.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa4b0" text-anchor="end">needs this patch</text><polyline points="978,278 202,278" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="590.0" y="269.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">5 keyboard drawn above the fullscreen app</text><polyline points="202,314 978,314" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="590.0" y="305.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="middle">6 tap keys</text><line x1="24" y1="378" x2="1156" y2="378" stroke="#232a33" stroke-width="1"/><text x="24.0" y="404.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Miss the patch and step 5 draws the keyboard behind the app. Miss --enable-wayland-ime and step 2 never happens.</text></svg>